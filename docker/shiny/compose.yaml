services:
  shiny-ta-monitor:
    build:
      context: .
      dockerfile: ./shiny_dockerfiles/shiny_ta_monitor_dockerfile
      args:
        - python_version=3.13
    entrypoint: ./shiny_ta_monitor_run.sh
    ports:
      - "4444:8000"
    restart: always

  web:
    image: nginx:alpine
    context: .
    container_name: nginx-https-test
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
