[project]
name = "jwql"
description = "The James Webb Space Telescope Quicklook Project"
readme = "README.md"
authors = [
  { name = "Matthew Bourque" },
  { name = "Lauren Chambers" },
  { name = "Misty Cracraft" },
  { name = "Mike Engesser" },
  { name = "Mees Fix" },
  { name = "Joe Filippazzo" },
  { name = "Bryan Hilbert" },
]
keywords = ["astronomy", "python"]
classifiers = ["Programming Language :: Python"]
dependencies = [
  "asdf",
  "astropy",
  "astroquery",
  "bokeh<3",
  "crds",
  "cryptography",
  "django",
  "inflection",
  "jinja2",
  "jsonschema",
  "jwst",
  "jwst_reffiles",
  "matplotlib",
  "nodejs",
  "numpy",
  "numpydoc",
  "pandas",
  "psycopg2-binary",
  "pysiaf",
  "pyvo",
  "scipy",
  "sqlalchemy",
  "stdatamodels",
  "wtforms",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
]
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "stsci_rtd_theme",
]

[project.license]
file = "LICENSE"
content-type = "text/plain"

[build-system]
requires = ["setuptools>=61.2,<=65.5.0", "numpy", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools_scm]

[tool.pytest]
junit_family = "xunit2"

[tool.ruff]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
norecursedirs = ["jwql/website/apps/jwql/static"]

[tool.bandit]
tests = ['B102', 'B103', 'B104', 'B105', 'B106', 'B107', 'B108', 'B110', 'B112', 'B201', 'B501', 'B502', 'B503', 'B504', 'B505', 'B506', 'B507', 'B601', 'B603', 'B604', 'B605', 'B606', 'B607', 'B609', 'B610', 'B611', 'B701', 'B702', 'B703']
skips = ['B101', 'B307', 'B310', 'B404', 'B602', 'B608']
